spring.application.name=${SPRING_APPLICATION_NAME:java_app}
logging.level.root=${SPRING_LOGGING_LEVEL_ROOT:INFO}

# Enhanced Speech Processing Configuration

# Enhanced Speech Processing Configuration
# Use Whisper API for more reliable transcription
speech.recognition.provider=whisper
vosk.model.path=src/main/resources/vosk-model-small-en-us-0.15
whisper.api.url=http://localhost:9000/v1/audio/transcriptions
whisper.api.key=${WHISPER_API_KEY:}

# Translation Configuration (fallback to local if API not available)
translation.provider=libre
libretranslate.url=http://localhost:5000
argos.translate.url=http://localhost:5001

# Text-to-Speech Configuration (disabled for now - focusing on transcription/translation)
tts.provider=none
coqui.tts.url=http://localhost:5002
piper.tts.url=http://localhost:5003
piper.path=/usr/local/bin/piper
piper.tts.enabled=false

# Real-time Translation Configuration
realtime.translation.provider=libre
realtime.tts.enable=false

# Executor Configuration
executor.corePoolSize=4
executor.maxPoolSize=8
executor.queueCapacity=100

# Logging
logging.level.echobridge.com.java_app=DEBUG
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.web=WARN
logging.level.akka=INFO


# Ghana NLP
# Add your Ghana NLP API key to application.properties
ghananlp.api.key=aa12d2d45c3c405cabce5954cd976047
ghananlp.api.url=https://translation-api.ghananlp.org
ghananlp.asr.url=https://translation-api.ghananlp.org/asr/v1/transcribe
ghananlp.languages.url=https://translation-api.ghananlp.org/v1/languages