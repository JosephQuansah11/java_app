<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Translation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            padding: 30px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .control-group select,
        .control-group input {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e1e5e9;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #28a745;
        }

        .status-indicator.recording {
            background: #ffc107;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .audio-visualizer {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .audio-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .audio-level {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #ffc107, #dc3545);
            width: 0%;
            transition: width 0.1s;
            border-radius: 4px;
        }

        .transcript-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .transcript-item {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .transcript-item.final {
            border-left-color: #28a745;
        }

        .transcript-item.translated {
            border-left-color: #764ba2;
            background: #f8f6ff;
        }

        .transcript-text {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .transcript-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            gap: 15px;
        }

        .language-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .confidence-score {
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Real-time Translation</h1>
            <p>Speak and see instant translations with audio feedback</p>
        </div>
        
        <div class="main-content">
            <div class="status-bar">
                <div id="statusIndicator" class="status-indicator"></div>
                <span id="statusText">Disconnected</span>
                <span id="sessionInfo" style="margin-left: auto; font-size: 12px; color: #666;"></span>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="sourceLanguage">Source Language</label>
                    <select id="sourceLanguage">
                        <option value="auto">Auto-detect</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="targetLanguage">Target Language</label>
                    <select id="targetLanguage">
                        <option value="es">Spanish</option>
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="ttsVoice">TTS Voice</label>
                    <select id="ttsVoice">
                        <option value="default">Default</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="ttsSpeed">Speech Speed</label>
                    <input type="range" id="ttsSpeed" min="0.5" max="2" step="0.1" value="1">
                    <small>Speed: <span id="ttsSpeedValue">1.0</span>x</small>
                </div>
                
                <div class="control-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="enableTTS" checked>
                        <label for="enableTTS">Enable Audio</label>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="connectBtn" class="btn btn-primary">Connect</button>
                <button id="startBtn" class="btn btn-primary" disabled>Start Recording</button>
                <button id="stopBtn" class="btn btn-danger" disabled>Stop Recording</button>
                <button id="clearBtn" class="btn btn-secondary">Clear Transcript</button>
            </div>

            <div class="audio-visualizer">
                <div class="audio-bar">
                    <div id="audioLevel" class="audio-level"></div>
                </div>
                <small>Audio Level</small>
            </div>

            <div class="transcript-container">
                <div id="transcriptContent">
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                        <p>Connect and start recording to see translations</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class RealTimeTranslationUI {
            constructor() {
                this.ws = null;
                this.mediaRecorder = null;
                this.audioContext = null;
                this.microphone = null;
                this.processor = null;
                this.isRecording = false;
                this.isConnected = false;
                this.sessionId = null;
                
                this.initializeElements();
                this.initializeEventListeners();
                this.initializeWebSpeechAPI();
            }
            
            initializeElements() {
                this.statusIndicator = document.getElementById('statusIndicator');
                this.statusText = document.getElementById('statusText');
                this.sessionInfo = document.getElementById('sessionInfo');
                this.connectBtn = document.getElementById('connectBtn');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.sourceLanguage = document.getElementById('sourceLanguage');
                this.targetLanguage = document.getElementById('targetLanguage');
                this.ttsVoice = document.getElementById('ttsVoice');
                this.ttsSpeed = document.getElementById('ttsSpeed');
                this.ttsSpeedValue = document.getElementById('ttsSpeedValue');
                this.enableTTS = document.getElementById('enableTTS');
                this.audioLevel = document.getElementById('audioLevel');
                this.transcriptContent = document.getElementById('transcriptContent');
            }
            
            initializeEventListeners() {
                this.connectBtn.addEventListener('click', () => this.toggleConnection());
                this.startBtn.addEventListener('click', () => this.startRecording());
                this.stopBtn.addEventListener('click', () => this.stopRecording());
                this.clearBtn.addEventListener('click', () => this.clearTranscript());
                
                this.ttsSpeed.addEventListener('input', (e) => {
                    this.ttsSpeedValue.textContent = e.target.value;
                    this.updateConfiguration();
                });
                
                this.sourceLanguage.addEventListener('change', () => this.updateConfiguration());
                this.targetLanguage.addEventListener('change', () => this.updateConfiguration());
                this.ttsVoice.addEventListener('change', () => this.updateConfiguration());
                this.enableTTS.addEventListener('change', () => this.updateConfiguration());
            }
            
            initializeWebSpeechAPI() {
                if ('speechSynthesis' in window) {
                    this.synthesis = window.speechSynthesis;
                    this.voices = [];
                    
                    const loadVoices = () => {
                        this.voices = this.synthesis.getVoices();
                    };
                    
                    loadVoices();
                    if (this.synthesis.onvoiceschanged !== undefined) {
                        this.synthesis.onvoiceschanged = loadVoices;
                    }
                }
            }
            
            toggleConnection() {
                if (this.isConnected) {
                    this.disconnect();
                } else {
                    this.connect();
                }
            }
            
            connect() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws-raw`;
                
                this.updateStatus('Connecting...', 'connecting');
                
                try {
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        this.isConnected = true;
                        this.updateStatus('Connected', 'connected');
                        this.connectBtn.textContent = 'Disconnect';
                        this.startBtn.disabled = false;
                        console.log('WebSocket connected');
                    };
                    
                    this.ws.onmessage = (event) => {
                        const message = JSON.parse(event.data);
                        this.handleMessage(message);
                    };
                    
                    this.ws.onclose = () => {
                        this.isConnected = false;
                        this.updateStatus('Disconnected', 'disconnected');
                        this.connectBtn.textContent = 'Connect';
                        this.startBtn.disabled = true;
                        this.stopBtn.disabled = true;
                        console.log('WebSocket disconnected');
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.updateStatus('Connection Error', 'error');
                    };
                    
                } catch (error) {
                    console.error('Failed to connect:', error);
                    this.updateStatus('Connection Failed', 'error');
                }
            }
            
            disconnect() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }
            
            async startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            sampleRate: 16000
                        } 
                    });
                    
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.microphone = this.audioContext.createMediaStreamSource(stream);
                    
                    this.processor = this.audioContext.createScriptProcessor(4096, 1, 1);
                    this.processor.onaudioprocess = (event) => {
                        const inputData = event.inputBuffer.getChannelData(0);
                        this.processAudioChunk(inputData);
                        this.updateAudioLevel(inputData);
                    };
                    
                    this.microphone.connect(this.processor);
                    this.processor.connect(this.audioContext.destination);
                    
                    this.isRecording = true;
                    this.updateStatus('Recording...', 'recording');
                    this.startBtn.disabled = true;
                    this.stopBtn.disabled = false;
                    
                    // Start transcription session
                    this.sendMessage({
                        type: 'start_transcription',
                        sourceLanguage: this.sourceLanguage.value,
                        targetLanguage: this.targetLanguage.value,
                        enableTTS: this.enableTTS.checked
                    });
                    
                } catch (error) {
                    console.error('Failed to start recording:', error);
                    this.updateStatus('Microphone Access Denied', 'error');
                }
            }
            
            stopRecording() {
                if (this.processor) {
                    this.processor.disconnect();
                    this.processor = null;
                }
                
                if (this.microphone) {
                    this.microphone.disconnect();
                    this.microphone = null;
                }
                
                if (this.audioContext) {
                    this.audioContext.close();
                    this.audioContext = null;
                }
                
                this.isRecording = false;
                this.updateStatus('Connected', 'connected');
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.audioLevel.style.width = '0%';
                
                // Stop transcription session
                this.sendMessage({
                    type: 'stop_transcription'
                });
            }
            
            processAudioChunk(audioData) {
                const int16Data = new Int16Array(audioData.length);
                for (let i = 0; i < audioData.length; i++) {
                    int16Data[i] = Math.max(-32768, Math.min(32767, audioData[i] * 32768));
                }
                
                const base64Audio = btoa(String.fromCharCode.apply(null, int16Data));
                
                this.sendMessage({
                    type: 'audio_chunk',
                    audioData: base64Audio
                });
            }
            
            updateAudioLevel(audioData) {
                let sum = 0;
                for (let i = 0; i < audioData.length; i++) {
                    sum += audioData[i] * audioData[i];
                }
                const rms = Math.sqrt(sum / audioData.length);
                const level = Math.min(100, rms * 200);
                this.audioLevel.style.width = `${level}%`;
            }
            
            handleMessage(message) {
                switch (message.type) {
                    case 'connection':
                        this.sessionId = message.sessionId;
                        this.sessionInfo.textContent = `Session: ${message.sessionId}`;
                        break;
                        
                    case 'transcription_started':
                        console.log('Transcription started');
                        break;
                        
                    case 'transcription_stopped':
                        console.log('Transcription stopped');
                        break;
                        
                    case 'transcription_result':
                        this.handleTranscriptionResult(message);
                        break;
                        
                    case 'tts_request':
                        this.handleTTSRequest(message);
                        break;
                        
                    case 'error':
                        console.error('Server error:', message.message);
                        this.updateStatus(`Error: ${message.message}`, 'error');
                        break;
                }
            }
            
            handleTranscriptionResult(message) {
                // Remove empty state if this is the first result
                const emptyState = this.transcriptContent.querySelector('.empty-state');
                if (emptyState) {
                    emptyState.remove();
                }
                
                // Only show final text (skip partial results)
                if (message.finalText) {
                    this.addTranscriptItem(message.finalText, 'final', message.confidence, 'final');
                }
                
                // Show translated text
                if (message.translatedText) {
                    this.addTranscriptItem(message.translatedText, 'translated', message.confidence, 'translated');
                }
            }
            
            addTranscriptItem(text, type, confidence, category) {
                const item = document.createElement('div');
                item.className = `transcript-item ${type}`;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'transcript-text';
                textDiv.textContent = text;
                
                const metaDiv = document.createElement('div');
                metaDiv.className = 'transcript-meta';
                
                const timestamp = new Date().toLocaleTimeString();
                const confidenceText = confidence ? `Confidence: ${(confidence * 100).toFixed(1)}%` : '';
                
                let languageBadge = '';
                if (category === 'final') {
                    languageBadge = `<span class="language-badge">${this.sourceLanguage.value.toUpperCase()}</span>`;
                } else if (category === 'translated') {
                    languageBadge = `<span class="language-badge">${this.targetLanguage.value.toUpperCase()}</span>`;
                }
                
                metaDiv.innerHTML = `
                    ${languageBadge}
                    <span class="confidence-score">${confidenceText}</span>
                    <span>${timestamp}</span>
                `;
                
                item.appendChild(textDiv);
                item.appendChild(metaDiv);
                
                this.transcriptContent.appendChild(item);
                this.transcriptContent.scrollTop = this.transcriptContent.scrollHeight;
            }
            
            handleTTSRequest(message) {
                if (!this.enableTTS.checked) return;
                
                if ('speechSynthesis' in window) {
                    this.synthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(message.text);
                    
                    const voice = this.voices.find(v => 
                        v.name.includes(this.ttsVoice.value) || 
                        v.lang.includes(this.targetLanguage.value)
                    );
                    if (voice) {
                        utterance.voice = voice;
                    }
                    
                    utterance.rate = parseFloat(this.ttsSpeed.value);
                    utterance.pitch = 1;
                    utterance.volume = message.isPartial ? 0.7 : 1;
                    
                    this.synthesis.speak(utterance);
                }
            }
            
            updateConfiguration() {
                if (!this.isConnected) return;
                
                this.sendMessage({
                    type: 'configure',
                    ttsVoice: this.ttsVoice.value,
                    ttsSpeed: parseFloat(this.ttsSpeed.value),
                    translationProvider: 'google'
                });
            }
            
            sendMessage(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                }
            }
            
            updateStatus(text, status) {
                this.statusText.textContent = text;
                this.statusIndicator.className = `status-indicator ${status}`;
            }
            
            clearTranscript() {
                this.transcriptContent.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                        <p>Connect and start recording to see translations</p>
                    </div>
                `;
            }
        }
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            new RealTimeTranslationUI();
        });
    </script>
</body>
</html>
