<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoBridge - Realtime Speech Translation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
        .recording { animation: pulse-red 2s infinite; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2 flex items-center justify-center gap-3">
                <i data-lucide="mic" class="w-8 h-8"></i>
                EchoBridge
            </h1>
            <p class="text-gray-600">Real-time Speech Translation & Processing</p>
        </header>

        <!-- Main Control Panel -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">Microphone Control</h2>
                <div class="flex items-center gap-4">
                    <span id="statusIndicator" class="flex items-center gap-2">
                        <div id="statusDot" class="w-3 h-3 bg-gray-400 rounded-full"></div>
                        <span id="statusText" class="text-sm text-gray-600">Inactive</span>
                    </span>
                </div>
            </div>

            <div class="flex gap-4 justify-center">
                <button id="startBtn" onclick="startMicrophone()" 
                    class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg flex items-center gap-2 transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="play" class="w-5 h-5"></i>
                    Start Microphone
                </button>
                <button id="stopBtn" onclick="stopMicrophone()" disabled
                    class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-lg flex items-center gap-2 transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="square" class="w-5 h-5"></i>
                    Stop Microphone
                </button>
                <button onclick="clearSession()" 
                    class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg flex items-center gap-2 transition-all transform hover:scale-105">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                    Clear Session
                </button>
            </div>

            <!-- Language Selection -->
            <div class="mt-6 flex items-center justify-center gap-4">
                <label class="text-gray-700 font-medium">Target Language:</label>
                <select id="targetLanguage" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                </select>
            </div>
        </div>

        <!-- Results Section -->
        <div class="grid md:grid-cols-2 gap-6">
            <!-- Transcription Results -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    Speech Transcription
                </h3>
                <div id="transcriptionResults" class="space-y-3 max-h-96 overflow-y-auto">
                    <p class="text-gray-500 text-center py-8">No transcriptions yet...</p>
                </div>
            </div>

            <!-- Translation Results -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                    <i data-lucide="languages" class="w-5 h-5"></i>
                    Translation Results
                </h3>
                <div id="translationResults" class="space-y-3 max-h-96 overflow-y-auto">
                    <p class="text-gray-500 text-center py-8">No translations yet...</p>
                </div>
            </div>
        </div>

        <!-- Manual Translation Section -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mt-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                <i data-lucide="type" class="w-5 h-5"></i>
                Manual Text Translation
            </h3>
            <div class="flex gap-4">
                <input type="text" id="manualText" placeholder="Enter text to translate..." 
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="translateManualText()" 
                    class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg flex items-center gap-2 transition-all">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    Translate
                </button>
            </div>
            <div id="manualTranslationResult" class="mt-4 p-4 bg-blue-50 rounded-lg hidden">
                <p class="text-sm text-gray-600">Translation:</p>
                <p id="manualTranslationText" class="text-lg font-medium text-gray-800"></p>
            </div>
        </div>
    </div>

    <script>
        let isRecording = false;
        const API_BASE = '/api/echo';
        let transcriptionHistory = [];
        let translationHistory = [];

        // Initialize Lucide icons
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            updateMicrophoneStatus();
            setInterval(updateMicrophoneStatus, 2000);
            setInterval(fetchLatestResults, 1500);
        });

        async function startMicrophone() {
            try {
                const response = await fetch(`${API_BASE}/microphone/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    isRecording = true;
                    updateMicrophoneStatus();
                    showNotification('Microphone started successfully!', 'success');
                    startRealtimeUpdates();
                } else {
                    showNotification('Failed to start microphone: ' + result.message, 'error');
                }
            } catch (error) {
                showNotification('Error starting microphone: ' + error.message, 'error');
            }
        }

        async function stopMicrophone() {
            try {
                const response = await fetch(`${API_BASE}/microphone/stop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    isRecording = false;
                    updateMicrophoneStatus();
                    showNotification('Microphone stopped successfully!', 'info');
                    stopRealtimeUpdates();
                } else {
                    showNotification('Failed to stop microphone: ' + result.message, 'error');
                }
            } catch (error) {
                showNotification('Error stopping microphone: ' + error.message, 'error');
            }
        }

        let realtimeInterval;
        
        function startRealtimeUpdates() {
            realtimeInterval = setInterval(() => {
                if (isRecording) {
                    fetchLatestResults();
                }
            }, 1000);
        }
        
        function stopRealtimeUpdates() {
            if (realtimeInterval) {
                clearInterval(realtimeInterval);
            }
        }

        async function updateMicrophoneStatus() {
            try {
                const response = await fetch(`${API_BASE}/microphone/status`);
                const status = await response.json();
                
                isRecording = status.active;
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');
                
                if (isRecording) {
                    statusDot.className = 'w-3 h-3 bg-red-500 rounded-full recording';
                    statusText.textContent = 'Recording';
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    statusDot.className = 'w-3 h-3 bg-gray-400 rounded-full';
                    statusText.textContent = 'Inactive';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function fetchLatestResults() {
            try {
                const response = await fetch(`${API_BASE}/results/latest`);
                const results = await response.json();
                
                updateTranscriptionResults(results.transcriptions || []);
                updateTranslationResults(results.translations || []);
            } catch (error) {
                console.error('Error fetching results:', error);
            }
        }

        function updateTranscriptionResults(transcriptions) {
            const container = document.getElementById('transcriptionResults');
            
            if (transcriptions.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">No transcriptions yet...</p>';
                return;
            }
            
            // Only show new transcriptions
            const newTranscriptions = transcriptions.filter(t => 
                !transcriptionHistory.some(existing => existing.text === t.text)
            );
            
            if (newTranscriptions.length > 0) {
                transcriptionHistory = [...transcriptionHistory, ...newTranscriptions].slice(-20);
                
                container.innerHTML = transcriptionHistory.slice(-10).reverse().map(t => `
                    <div class="p-3 bg-gray-50 rounded-lg fade-in border-l-4 border-blue-500">
                        <p class="text-gray-800 font-medium">${t.text || 'Empty transcription'}</p>
                        <p class="text-xs text-gray-500 mt-1">
                            ${t.language ? 'Language: ' + t.language : ''} 
                            ${t.confidence ? ' | Confidence: ' + Math.round(t.confidence * 100) + '%' : ''}
                            ${t.timestamp ? ' | ' + new Date(t.timestamp).toLocaleTimeString() : ''}
                        </p>
                    </div>
                `).join('');
            }
        }

        function updateTranslationResults(translations) {
            const container = document.getElementById('translationResults');
            
            if (translations.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">No translations yet...</p>';
                return;
            }
            
            // Only show new translations
            const newTranslations = translations.filter(t => 
                !translationHistory.some(existing => 
                    existing.originalText === t.originalText && 
                    existing.translatedText === t.translatedText
                )
            );
            
            if (newTranslations.length > 0) {
                translationHistory = [...translationHistory, ...newTranslations].slice(-20);
                
                container.innerHTML = translationHistory.slice(-10).reverse().map(t => `
                    <div class="p-3 bg-blue-50 rounded-lg fade-in border-l-4 border-green-500">
                        <p class="text-sm text-gray-600">Original: ${t.originalText}</p>
                        <p class="text-gray-800 font-medium text-lg">${t.translatedText}</p>
                        <p class="text-xs text-gray-500 mt-1">
                            ${t.fromLanguage} → ${t.toLanguage}
                            ${t.timestamp ? ' | ' + new Date(t.timestamp).toLocaleTimeString() : ''}
                        </p>
                    </div>
                `).join('');
            }
        }

        async function translateManualText() {
            const text = document.getElementById('manualText').value.trim();
            const targetLanguage = document.getElementById('targetLanguage').value;
            
            if (!text) {
                showNotification('Please enter text to translate', 'warning');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        q: text,
                        source: 'auto',
                        target: targetLanguage,
                        format: 'text',
                        alternatives: 3,
                        api_key: ''
                    })
                });
                
                const result = await response.json();
                
                // Handle LibreTranslate API response format
                if (result.translatedText) {
                    document.getElementById('manualTranslationText').textContent = result.translatedText;
                    document.getElementById('manualTranslationResult').classList.remove('hidden');
                    showNotification('Translation completed!', 'success');
                    
                    // Add to translation history with full response data
                    translationHistory.push({
                        originalText: text,
                        translatedText: result.translatedText,
                        fromLanguage: result.detected_language || result.fromLanguage || 'auto',
                        toLanguage: targetLanguage,
                        timestamp: new Date().toISOString()
                    });
                    updateTranslationResults(translationHistory);
                } else {
                    showNotification('Translation failed: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showNotification('Error translating text: ' + error.message, 'error');
            }
        }

        async function clearSession() {
            try {
                await fetch(`${API_BASE}/session/clear`, { method: 'POST' });
                transcriptionHistory = [];
                translationHistory = [];
                document.getElementById('transcriptionResults').innerHTML = '<p class="text-gray-500 text-center py-8">No transcriptions yet...</p>';
                document.getElementById('translationResults').innerHTML = '<p class="text-gray-500 text-center py-8">No translations yet...</p>';
                document.getElementById('manualTranslationResult').classList.add('hidden');
                document.getElementById('manualText').value = '';
                showNotification('Session cleared successfully!', 'info');
            } catch (error) {
                showNotification('Error clearing session: ' + error.message, 'error');
            }
        }

        function showNotification(message, type = 'info') {
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };
            
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
