<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 Real-time Translation Only - Akka Streams Powered</title>
    <link rel="stylesheet" href="/css/translation-client.css">
</head>
<body>
    <div class="container">
        <h1>🌐 Real-time Translation Only</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">
            Powered by Akka Streams • Essay-format content • Instant translation
        </p>
        
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div class="settings">
            <h3>Settings</h3>
            <div class="setting-group">
                <label for="sourceLanguage">Source Language:</label>
                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="tw">Twi (Ghana)</option>
                    <option value="ak">Akan (Ghana)</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label for="targetLanguage">Target Language:</label>
                <select id="targetLanguage">
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="tw">Twi (Ghana)</option>
                    <option value="ak">Akan (Ghana)</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label for="ttsVoice">TTS Voice:</label>
                <select id="ttsVoice">
                    <option value="default">Default</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label for="ttsSpeed">TTS Speed:</label>
                <input type="range" id="ttsSpeed" min="0.5" max="2" step="0.1" value="1">
                <span id="ttsSpeedValue">1.0</span>
            </div>
            
            <div class="setting-group">
                <label for="enableTTS">
                    <input type="checkbox" id="enableTTS" checked> Enable TTS
                </label>
            </div>
        </div>
        
        <div class="controls">
            <button id="connectBtn" class="start-btn">Connect</button>
            <button id="startBtn" class="start-btn" disabled>Start Recording</button>
            <button id="stopBtn" class="stop-btn" disabled>Stop Recording</button>
            <button id="clearBtn" class="start-btn">Clear Transcript</button>
        </div>
        
        <div class="audio-level">
            <h4>Audio Level</h4>
            <div class="audio-bar">
                <div id="audioLevelBar" class="audio-level-bar"></div>
            </div>
        </div>
        
        <div class="websocket-status">
            <h3>WebSocket Status</h3>
            <div id="websocketLog" class="websocket-log"></div>
        </div>
        
        <div class="transcript-container">
            <h3>🌐 Real-time Translations</h3>
            <div id="transcript"></div>
        </div>
    </div>

    <script src="/js/translation-client.js"></script>
</body>
</html>
