plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

import java.util.concurrent.TimeUnit

group = 'echobridge.com'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' } // Fallback
	maven { url 'https://repo1.maven.org/maven2' }
    maven { url 'https://oss.sonatype.org/content/repositories/releases' }
}

dependencies {
	// HTTP clients for APIs
	// implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// HTTP client for API calls
   	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.projectreactor.netty:reactor-netty-http:1.1.0'

	// JSON processing
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	
	implementation 'com.typesafe.akka:akka-actor-typed_2.13:2.6.20'

	// Akka streams
	implementation 'com.typesafe.akka:akka-stream_2.13:2.6.20'
    implementation 'com.typesafe.akka:akka-stream-typed_2.13:2.6.20'
	implementation 'com.typesafe.akka:akka-serialization-jackson_2.13:2.6.20'
	
	// Akka cluster
	implementation 'com.typesafe.akka:akka-cluster_2.13:2.6.20'
    implementation 'com.typesafe.akka:akka-cluster-tools_2.13:2.6.20'
    
	// implementation 'com.typesafe.akka:akka-cluster-sharding_2.13:2.6.20'
	implementation 'com.typesafe.akka:akka-cluster-sharding-typed_2.13:2.6.20'
	
	// implementation 'com.typesafe.akka:akka-persistence_2.13:2.6.20'
	// implementation 'com.typesafe.akka:akka-persistence-typed_2.13:2.6.20'
    implementation 'com.typesafe.akka:akka-persistence-typed_2.13:2.6.20'	

	// Websocket and templating
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// Add WebSocket messaging support
	implementation 'org.springframework:spring-messaging'
	implementation 'org.springframework:spring-websocket'
	
	// Audio processing
	implementation 'net.java.dev.jna:jna:5.7.0'
    implementation 'com.alphacephei:vosk:0.3.38'

    
    // File upload support
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-io:commons-io:2.11.0'
	
	// Development
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Test
    testImplementation 'com.typesafe.akka:akka-stream-testkit_2.13:2.6.20'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Alternative: Simple background starter without port detection
task startPiperBackground {
    group = 'application'
    description = 'Starts Piper TTS server in background (simple version)'
    
    doLast {
        // Cross-platform background process
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def pythonCmd = isWindows ? 'python' : 'python3'
        
        // Use Java ProcessBuilder instead of exec for background processes
        def pb = new ProcessBuilder(pythonCmd, 'piper-server/server.py', '5003')
        pb.directory(project.rootDir)
        pb.inheritIO()
        
        def process = pb.start()
        project.ext.piperProcess = process
        
        sleep(3000) // Wait 3 seconds for startup
        
        System.setProperty('PIPER_TTS_URL', 'http://localhost:5003')
        println "Piper TTS Server started on port 5003 (PID: ${process.pid()})"
        
        // Set environment variable or property for Spring Boot
        System.setProperty('PIPER_TTS_URL', 'http://localhost:5003')
    }
}

// Register shutdown hook to kill Piper
gradle.buildFinished {
    if (project.hasProperty('piperProcess')) {
        println "Stopping Piper TTS Server..."
        project.piperProcess.destroy()
        project.piperProcess.waitFor(5, TimeUnit.SECONDS)
        if (project.piperProcess.isAlive()) {
            project.piperProcess.destroyForcibly()
        }
    }
}

// Make bootRun depend on Piper
bootRun {
    dependsOn startPiperBackground
    
    // Pass Piper URL to Spring Boot
    environment 'PIPER_TTS_URL', 'http://localhost:5003'
    
    // Or as system property
    systemProperty 'piper.tts.url', 'http://localhost:5003'
}

// Combined task
task runWithPiper {
    group = 'application'
    description = 'Runs Spring Boot with Piper TTS server (convenience task)'
    dependsOn bootRun
}

// Task to stop Piper manually (if needed)
task stopPiper {
    group = 'application'
    description = 'Stops Piper TTS server'
    
    doLast {
        exec {
            commandLine 'pkill', '-f', 'piper_tts_server.py'
            ignoreExitValue true
        }
    }
}
