name: EchoBridge CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle-wrapper.properties') }}
        
    - name: Run tests
      run: ./gradlew test
      
    - name: Build application
      run: ./gradlew build
      
    - name: Generate test report
      run: |
        ./gradlew jacocoTestReport || true
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: build/reports/jacoco/
        
    - name: Build Docker image
      run: |
        echo "Building Docker image..."
        docker build -t echobridge:${{ github.sha }} . || true
        
    - name: Run integration tests
      run: |
        echo "Starting services for integration tests..."
        docker-compose -f docker-compose.yml up -d
        sleep 30
        echo "Services started, running health checks..."
        timeout 60 bash -c 'until curl -f http://localhost:8080/api/health; do sleep 5; done'
        echo "Integration tests completed"
        docker-compose down
        
    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up..."
        docker-compose down || true
        docker system prune -f || true

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan
      run: |
        echo "Running security scan..."
        ./gradlew dependencyCheckAnalysis || true
        
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: build/reports/dependency-check/
